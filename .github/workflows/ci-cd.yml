name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    name: Tests et packaging
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 21 et le cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Exécuter les tests Maven
        run: mvn clean test

      - name: Construire le package Maven
        run: mvn package -DskipTests

      - name: SAST — analyser le code avec Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java

      - name: SCA — analyser le repository avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Construire l'image Docker candidate
        run: docker build -t africfinance-app:ci-${{ github.sha }} .

      - name: Trivy — contrôler l'image avant promotion
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: africfinance-app:ci-${{ github.sha }}
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Préparer les tags GHCR sans reconstruire l'image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/africfinance-app
        run: |
          IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          docker tag "africfinance-app:ci-${GITHUB_SHA}" "$IMAGE_REPOSITORY:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            docker tag "africfinance-app:ci-${GITHUB_SHA}" "$IMAGE_REPOSITORY:latest"
          fi

      - name: Authentifier Docker auprès de GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image validée dans GHCR
        run: |
          docker push "$IMAGE_REPOSITORY:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            docker push "$IMAGE_REPOSITORY:latest"
          fi
