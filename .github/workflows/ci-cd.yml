name: CI/CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  ci:
    name: Tests et packaging
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 21 et le cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Exécuter les tests Maven
        run: mvn clean test

      - name: Construire le package Maven
        run: mvn package -DskipTests

      - name: SAST — analyser le code avec Semgrep
        run: docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.139.0 scan --config p/java /src

      - name: SCA — analyser le repository avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Construire l'image Docker candidate
        run: docker build -t africfinance-app:ci-${{ github.sha }} .

      - name: Trivy — contrôler l'image avant promotion
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: africfinance-app:ci-${{ github.sha }}
          version: v0.70.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Préparer les tags GHCR sans reconstruire l'image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/africfinance-app
        run: |
          IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          docker tag "africfinance-app:ci-${GITHUB_SHA}" "$IMAGE_REPOSITORY:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            docker tag "africfinance-app:ci-${GITHUB_SHA}" "$IMAGE_REPOSITORY:latest"
          fi

      - name: Authentifier Docker auprès de GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image validée dans GHCR
        run: |
          docker push "$IMAGE_REPOSITORY:sha-${GITHUB_SHA}"
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            docker push "$IMAGE_REPOSITORY:latest"
          fi

      - name: Préparer SSH et déployer sur le VPS
        if: github.ref == 'refs/heads/master' && vars.ENABLE_VPS_DEPLOYMENT == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_DEPLOY_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          SSH_PORT="${VPS_PORT:-22}"
          SSH_TARGET="$VPS_USER@$VPS_HOST"
          scp -P "$SSH_PORT" -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes scripts/deploy.sh "$SSH_TARGET:/tmp/africfinance-deploy.sh"
          printf '%s\n%s\n' "${GHCR_DEPLOY_USERNAME:-}" "${GHCR_DEPLOY_TOKEN:-}" | ssh -p "$SSH_PORT" -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes "$SSH_TARGET" "bash /tmp/africfinance-deploy.sh '$IMAGE_REPOSITORY:sha-${GITHUB_SHA}' africfinance-app 8080 production"

      - name: Ouvrir le tunnel SSH pour ZAP
        if: github.ref == 'refs/heads/master' && vars.ENABLE_VPS_DEPLOYMENT == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          SSH_PORT="${VPS_PORT:-22}"
          ssh -N -L 18080:127.0.0.1:8080 -p "$SSH_PORT" -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" &
          echo $! > "$RUNNER_TEMP/africfinance-ssh-tunnel.pid"

      - name: DAST — OWASP ZAP Baseline (advisory)
        if: github.ref == 'refs/heads/master' && vars.ENABLE_VPS_DEPLOYMENT == 'true'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:18080
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-baseline

      - name: Fermer le tunnel SSH
        if: always() && github.ref == 'refs/heads/master' && vars.ENABLE_VPS_DEPLOYMENT == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/africfinance-ssh-tunnel.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/africfinance-ssh-tunnel.pid")"
          fi

      - name: Résumé du déploiement
        if: success() && github.ref == 'refs/heads/master' && vars.ENABLE_VPS_DEPLOYMENT == 'true'
        run: |
          {
            echo '## Deployment successful'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Image: ${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
            echo 'Environment: production'
          } >> "$GITHUB_STEP_SUMMARY"
